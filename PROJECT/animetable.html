<!DOCTYPE html>
<html>
    <head>
        <title>ANIME TABLE</title>
        <link rel="stylesheet" href="animetable.css">
    </head>
    <body>
        <div id="count">WHO IS RUNING...</div>
        <table class="board">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ANIME NAME</th>
                    <th>MAIN CHARACTER</th>
                    <th>SIDE CHARACTER</th>
                    <th>MAIN CHARACTER POWER</th>
                    <th>SIDE CHARACTER POWER</th>
                    <th>WORDS</th>
                    <th>STATS</th>
                    <th>ACTIONS</th>
                </tr>
            </thead>
            <tbody id="animeTable"></tbody>
        </table>
        <div class="functionButtons">
            <a href="animeform.html">
                <button id="addAnime">Add Anime</button>
            </a>
        </div>
        <script src="animetable.js"></script>
    </body>
</html>
